<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Librarian - Administrador</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header>
    <h1>Librarian - Admin</h1>
    <nav>
      <button type="button" class="activo" data-seccion="libros">Libros</button>
      <button type="button" data-seccion="prestamos">Préstamos</button>
      <button type="button" data-seccion="ventas">Ventas</button>
      <button type="button" data-seccion="clientes">Clientes</button>
    </nav>
    <button id="btnSalir" type="button">Salir</button>
  </header>
  <main>
    <section id="libros" class="seccion caja activa">
      <h2>Gestionar libros</h2>
      <form id="formLibro" class="formulario">
        <input type="hidden" id="libroId">
        <input name="titulo" placeholder="Título" required>
        <input name="autor" placeholder="Autor" required>
        <input name="isbn" placeholder="ISBN">
        <input name="editorial" placeholder="Editorial">
        <input name="anio" type="number" placeholder="Año">
        <input name="precio" type="number" step="0.01" min="0" placeholder="Precio" required>
        <input name="stock" type="number" min="0" placeholder="Stock" required>
        <button type="submit">Guardar</button>
        <button type="button" id="btnLimpiarLibro">Limpiar</button>
      </form>
      <p id="mensajeLibro" class="mensaje"></p>
      <input id="buscarLibro" class="buscador" placeholder="Buscar por título, autor o ISBN">
      <table>
        <thead>
          <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>ISBN</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaLibros"></tbody>
      </table>
    </section>

    <section id="prestamos" class="seccion caja">
      <h2>Prestar libros</h2>
      <form id="formPrestamo" class="formulario">
        <select name="libro_id" id="selectLibroPrestamo" required></select>
        <select name="usuario_id" id="selectUsuarioPrestamo" required></select>
        <label>Fecha de préstamo <input type="date" name="fecha_prestamo"></label>
        <label>Devolución tentativa <input type="date" name="fecha_devolucion_tentativa" required></label>
        <button type="submit">Prestar</button>
      </form>
      <p id="mensajePrestamo" class="mensaje"></p>
      <table>
        <thead>
          <tr>
            <th>Libro</th>
            <th>Usuario</th>
            <th>Préstamo</th>
            <th>Devolución tentativa</th>
            <th>Devolución</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaPrestamos"></tbody>
      </table>
    </section>

    <section id="ventas" class="seccion caja">
      <h2>Venta de libros</h2>
      <form id="formVenta" class="formulario">
        <select name="cliente_id" id="selectCliente" required></select>
        <input type="date" name="fecha">
        <div id="filasVenta" style="width: 100%;"></div>
        <button type="button" id="btnAgregarFila">+ Libro</button>
        <button type="submit">Registrar venta</button>
      </form>
      <p id="mensajeVenta" class="mensaje"></p>
      <div id="listaVentas"></div>
    </section>

    <section id="clientes" class="seccion caja">
      <h2>Clientes</h2>
      <form id="formCliente" class="formulario">
        <input name="identificacion" placeholder="Identificación" required>
        <input name="nombre" placeholder="Nombre" required>
        <input name="telefono" placeholder="Teléfono">
        <input name="direccion" placeholder="Dirección">
        <input type="email" name="email" placeholder="Correo">
        <button type="submit">Crear cliente</button>
      </form>
      <p id="mensajeCliente" class="mensaje"></p>
      <table>
        <thead>
          <tr>
            <th>Identificación</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Dirección</th>
            <th>Correo</th>
          </tr>
        </thead>
        <tbody id="tablaClientes"></tbody>
      </table>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
